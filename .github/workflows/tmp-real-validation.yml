name: temporary-real-validation
on:
  push:
    branches: [ chatgpt-real-validation-20260904 ]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install numpy pandas scipy requests
      - run: python tmp_real_validation/build_lcl_official_weekly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcl-official-weekly
          path: real_validation_output/
